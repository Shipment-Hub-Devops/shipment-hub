# Ansible configuration for ShipmentHub.
#
# Ansible reads ansible.cfg from the current working directory, so this
# applies when running from inside ansible/. The CD pipeline runs from the
# repository root and therefore sets ANSIBLE_CONFIG to point here.
[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
# Fail fast in CI rather than hanging on an unreachable host
timeout = 30

[ssh_connection]
# Reduces the number of SSH operations per task; matters more when every
# connection is tunnelled through the jumpbox.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
