# Summative inventory — the app VM lives in a PRIVATE subnet and is reached
# through the bastion/jumpbox (SSH ProxyJump).
#
# Both addresses below MUST be filled in from Terraform after `apply`:
#   terraform output bastion_public_ip   -> REPLACE_WITH_JUMPBOX_IP
#   terraform output app_vm_private_ip   -> REPLACE_WITH_APP_VM_PRIVATE_IP
#
# The app NIC uses `private_ip_address_allocation = "Dynamic"`, so its address
# is assigned by Azure and is NOT a fixed value — do not hardcode it.

# Internet-facing host. Runs the nginx reverse proxy (jumpbox.yml) and acts as
# the SSH bastion for everything in [web].
[jumpbox]
shipment-hub-jumpbox ansible_host=REPLACE_WITH_JUMPBOX_IP

# Application host. No public IP — every connection is tunnelled through the
# jumpbox via the ProxyJump argument below.
[web]
shipment-hub-vm ansible_host=REPLACE_WITH_APP_VM_PRIVATE_IP

[jumpbox:vars]
ansible_user=azureadmin
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

[web:vars]
ansible_user=azureadmin
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o ProxyJump=azureadmin@REPLACE_WITH_JUMPBOX_IP
