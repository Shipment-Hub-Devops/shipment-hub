# Summative inventory — the app VM lives in a PRIVATE subnet and is reached
# through the jumpbox (SSH ProxyJump).
#
# Fill in after `terraform apply`:
#   JUMPBOX_IP  = terraform output jumpbox_public_ip
#   app host    = terraform output app_vm_private_ip (default 10.0.2.10)
[web]
shipment-hub-vm ansible_host=10.0.2.10

[web:vars]
ansible_user=azureadmin
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o ProxyJump=azureadmin@REPLACE_WITH_JUMPBOX_IP
