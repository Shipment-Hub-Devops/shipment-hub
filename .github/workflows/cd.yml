# CD Pipeline for ShipmentHub — "Deploy to Production"
#
# Triggers ONLY on a merge/push to main. Implements the Git-to-Production flow:
#   1. Re-run the full CI suite (lint, test, dependency/image/IaC security scans)
#   2. Build the API and migration images and push them to Azure Container Registry
#   3. Run the Ansible playbook against the private app VM (via the bastion) to
#      apply migrations, pull the new image and restart the stack
#
# Required repository secrets, and where each value comes from.
# Run `terraform output` in terraform/ after applying:
#
#   ACR_LOGIN_SERVER   terraform output registry_login_server
#   ACR_USERNAME       terraform output registry_admin_username
#   ACR_PASSWORD       terraform output -raw registry_admin_password
#   JUMPBOX_IP         terraform output bastion_public_ip
#   APP_VM_PRIVATE_IP  terraform output app_vm_private_ip
#                      NOTE: the app NIC uses Dynamic allocation, so this is
#                      assigned by Azure — never assume a fixed address.
#   VM_ADMIN_USER      the admin_username variable used by terraform (azureadmin)
#   SSH_PRIVATE_KEY    private key matching the public key deployed to the VMs
#   JWT_SECRET         application JWT secret (generate one, not a terraform output)
#   DATABASE_URL       constructed by hand — there is no single output for it:
#                      postgresql://<admin>:<password>@<terraform output database_fqdn>:5432/shipmenthub?sslmode=require
name: CD Pipeline

on:
  push:
    branches:
      - main

# Prevent two deploys from racing each other if two merges land close together.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:

  # Job 1: Run the same checks CI runs on every PR (lint, tests, npm audit,
  # Trivy image scan, Checkov IaC scan). This is the pipeline's security gate —
  # a merge to main is not allowed to skip straight to deployment. Reusing
  # ci.yml (via workflow_call) instead of copy-pasting its jobs means the two
  # workflows can never drift out of sync.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Job 2: Build the production images and push them to ACR.
  # Runs only if every CI job succeeded.
  build-and-push:
    name: Build & push images to ACR
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-tag.outputs.image }}
      migrator: ${{ steps.image-tag.outputs.migrator }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticates to the registry with the ACR admin credentials produced by
      # Terraform. A service principal + `azure/login` would be preferable — it
      # exchanges for a short-lived token instead of a long-lived password — but
      # that needs an AZURE_CREDENTIALS secret which is not provisioned yet.
      # Swap this step for azure/login + `az acr login` once it is.
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Tag with the commit SHA (immutable, traceable, lets deploy.yml pull a
      # specific version) as well as :latest (for convenience / manual pulls).
      - name: Compute image tags
        id: image-tag
        run: |
          echo "image=${{ secrets.ACR_LOGIN_SERVER }}/shipmenthub-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "migrator=${{ secrets.ACR_LOGIN_SERVER }}/shipmenthub-migrator:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.image-tag.outputs.image }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/shipmenthub-api:latest \
            -f Dockerfile .

      # Separate image carrying sequelize-cli, used by Ansible to apply
      # migrations. Kept out of the runtime image to keep it lean and to keep
      # its dev-only dependencies out of the production audit surface.
      - name: Build migration runner image
        run: |
          docker build --target migrator \
            -t ${{ steps.image-tag.outputs.migrator }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/shipmenthub-migrator:latest \
            -f Dockerfile .

      # Fail the deploy before anything is published if the image carries a
      # CRITICAL vulnerability.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.image-tag.outputs.image }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Push Docker images
        run: |
          docker push ${{ steps.image-tag.outputs.image }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/shipmenthub-api:latest
          docker push ${{ steps.image-tag.outputs.migrator }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/shipmenthub-migrator:latest

  # Job 3: Configure and deploy via Ansible.
  # The app VM has no public IP (see terraform/modules/compute/main.tf), so
  # every SSH connection has to hop through the bastion host. This job builds
  # an inventory at runtime (never commit real IPs) and proxies through it.
  deploy:
    name: Deploy to production VM
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      # The playbooks run from the repo root, where Ansible would not otherwise
      # find ansible/ansible.cfg.
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_HOST_KEY_CHECKING: 'False'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ansible-core ships only ansible.builtin. deploy.yml uses
      # community.docker and playbook.yml uses community.general, so the
      # collections must be installed explicitly or the run fails on its first
      # task with an unresolved module.
      - name: Install Ansible
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      # Loads the deploy key into an SSH agent for this job only; nothing is
      # written to disk beyond the agent socket, and the key never appears in logs.
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Generated fresh every run instead of committing ansible/inventory.ini
      # with real IPs. ansible_ssh_common_args tells every SSH connection to
      # the app VM to tunnel through the bastion first (ProxyCommand), since
      # the app VM's private IP is unreachable directly from the internet.
      # StrictHostKeyChecking is disabled because this is a short-lived CI
      # runner with no prior known_hosts entry for infrastructure we own;
      # do not disable this for connections to hosts outside your control.
      - name: Generate dynamic inventory
        run: |
          cat > inventory.cd.ini <<EOF
          [web]
          shipment-hub-vm ansible_host=${{ secrets.APP_VM_PRIVATE_IP }} ansible_user=${{ secrets.VM_ADMIN_USER }} ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -o StrictHostKeyChecking=no -W %h:%p -q ${{ secrets.VM_ADMIN_USER }}@${{ secrets.JUMPBOX_IP }}"'
          EOF

      # Runs deploy.yml (not playbook.yml — playbook.yml is the one-time server
      # setup that installs Docker/UFW/SSH-hardening and is applied manually,
      # not on every deploy). deploy.yml logs into ACR from the VM, renders the
      # production docker-compose file, applies migrations, then restarts the
      # stack and verifies no migration is left pending.
      #
      # use_managed_db=true is required: without it the compose template also
      # renders a local postgres container and points the API at it instead of
      # the managed Azure database.
      - name: Run Ansible deploy playbook
        run: |
          ansible-playbook -i inventory.cd.ini ansible/deploy.yml \
            -e registry_server=${{ secrets.ACR_LOGIN_SERVER }} \
            -e registry_username=${{ secrets.ACR_USERNAME }} \
            -e registry_password=${{ secrets.ACR_PASSWORD }} \
            -e app_image=${{ needs.build-and-push.outputs.image }} \
            -e migrator_image=${{ needs.build-and-push.outputs.migrator }} \
            -e database_url='${{ secrets.DATABASE_URL }}' \
            -e jwt_secret='${{ secrets.JWT_SECRET }}' \
            -e use_managed_db=true
