# CD Pipeline for ShipmentHub — "Deploy to Production"
#
# Triggers ONLY on a merge/push to main. Implements the Git-to-Production flow:
#   1. Re-run the full CI suite (lint, test, dependency/image/IaC security scans)
#   2. Build the API image and push it to Azure Container Registry (ACR)
#   3. Authenticate to Azure
#   4. Run the Ansible playbook against the private app VM (via the bastion) to
#      pull the new image and restart the stack with docker compose
#
# Required GitHub repo configuration (Settings > Secrets and variables > Actions):
# see the "Secrets" and "Variables" tabs documented in ansible/README.md and in
# the PR description for this change.
name: CD Pipeline

on:
  push:
    branches:
      - main

# Prevent two deploys from racing each other if two merges land close together.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:

  # Job 1: Run the same checks CI runs on every PR (lint, tests, npm audit,
  # Trivy image scan, Checkov IaC scan). This is the pipeline's security gate —
  # a merge to main is not allowed to skip straight to deployment. Reusing
  # ci.yml (via workflow_call) instead of copy-pasting its jobs means the two
  # workflows can never drift out of sync.

  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Job 2: Build the production image and push it to ACR.
  # Runs only if every CI job succeeded.

  build-and-push:
    name: Build & push image to ACR
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-tag.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticates the runner to Azure using a service principal stored as
      # the AZURE_CREDENTIALS secret. This is the pipeline's "authenticate to
      # your cloud provider" step — az CLI and other azure/* actions in this
      # job run as this identity.
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # az acr login exchanges the Azure session above for a short-lived Docker
      # token, so no separate long-lived registry password is needed here.
      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      # Tag with the commit SHA (immutable, traceable, lets deploy.yml pull a
      # specific version) as well as :latest (for convenience / manual pulls).
      - name: Compute image tag
        id: image-tag
        run: echo "image=${{ vars.ACR_LOGIN_SERVER }}/shipmenthub-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.image-tag.outputs.image }} \
            -t ${{ vars.ACR_LOGIN_SERVER }}/shipmenthub-api:latest \
            -f Dockerfile .

      - name: Push Docker image
        run: |
          docker push ${{ steps.image-tag.outputs.image }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/shipmenthub-api:latest

  # Job 3: Configure and deploy via Ansible.
  # The app VM has no public IP (see terraform/modules/compute/main.tf), so
  # every SSH connection has to hop through the bastion host. This job builds
  # an inventory at runtime (never commit real IPs) and proxies through it.

  deploy:
    name: Deploy to production VM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible
          # deploy.yml's "Log in to container registry" task uses this collection
          ansible-galaxy collection install community.docker

      # Loads the deploy key into an SSH agent for this job only; nothing is
      # written to disk beyond the agent socket, and the key never appears in logs.
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Generated fresh every run instead of committing ansible/inventory.ini
      # with real IPs. ansible_ssh_common_args tells every SSH connection to
      # the app VM to tunnel through the bastion first (ProxyCommand), since
      # the app VM's private IP is unreachable directly from the internet.
      # StrictHostKeyChecking is disabled because this is a short-lived CI
      # runner with no prior known_hosts entry for infrastructure we own;
      # do not disable this for connections to hosts outside your control.
      - name: Generate dynamic inventory
        run: |
          cat > inventory.cd.ini <<EOF
          [web]
          shipment-hub-vm ansible_host=${{ vars.APP_VM_PRIVATE_IP }} ansible_user=${{ vars.SSH_USER }} ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -o StrictHostKeyChecking=no -W %h:%p -q ${{ vars.SSH_USER }}@${{ vars.BASTION_HOST }}"'
          EOF

      # Runs deploy.yml (not playbook.yml — playbook.yml is the one-time server
      # setup that installs Docker/UFW/SSH-hardening and is applied manually,
      # not on every deploy). deploy.yml logs into ACR from the VM, renders the
      # production docker-compose file, pulls the new image, and restarts the
      # stack with a health check.
      - name: Run Ansible deploy playbook
        run: |
          ansible-playbook -i inventory.cd.ini ansible/deploy.yml \
            -e registry_server=${{ vars.ACR_LOGIN_SERVER }} \
            -e registry_username=${{ secrets.REGISTRY_USERNAME }} \
            -e registry_password=${{ secrets.REGISTRY_PASSWORD }} \
            -e app_image=${{ needs.build-and-push.outputs.image }} \
            -e database_url=${{ secrets.DATABASE_URL }} \
            -e jwt_secret=${{ secrets.JWT_SECRET }}
